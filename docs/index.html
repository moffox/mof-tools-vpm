<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MofTools</title>
<style>
body{font:16px/1.8 system-ui,sans-serif;color:#243042;background:#f5f7fb;margin:0}
main{max-width:720px;margin:64px auto;padding:32px;background:white;border-radius:16px}
h1{margin-top:0}a{color:#2658b8}.button{display:inline-block;background:#2658b8;color:white;padding:10px 24px;border-radius:8px;text-decoration:none}
li{margin:16px 0}code{overflow-wrap:anywhere}@media(max-width:780px){main{margin:20px;padding:24px}}
</style>
<main>
<h1>MofTools</h1>
<p>MofToolsが配布するUnity拡張の共通リポジトリです。</p>
<a class="button" href="vcc://vpm/addRepo?url=https%3A%2F%2Fmoffox.github.io%2Fmof-tools-vpm%2Findex.json">VCCに追加</a>
<p>ボタンで追加できない場合は、VCCのSettingsから次の配布一覧URLを追加してください。</p>
<p><a href="index.json"><code>https://moffox.github.io/mof-tools-vpm/index.json</code></a></p>
<h2>配布ツール</h2>
<ul id="packages"><li>一覧を読み込んでいます。</li></ul>
<p><a href="https://github.com/moffox/mof-tools-vpm">GitHub</a> · 連絡先: <a href="mailto:github-moffox@outlook.jp">github-moffox@outlook.jp</a></p>
</main>
<script>
fetch('index.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{
  const list=document.getElementById('packages');list.replaceChildren();
  for(const [id,pkg] of Object.entries(data.packages||{})){
    const versions=Object.values(pkg.versions||{});if(!versions.length)continue;
    const li=document.createElement('li');const name=document.createElement('strong');
    name.textContent=versions[0].displayName+' ('+id+')';li.append(name);
    const detail=document.createElement('div');detail.textContent='公開バージョン: '+versions.map(v=>v.version).join(', ');li.append(detail);list.append(li);
  }
  if(!list.children.length){const li=document.createElement('li');li.textContent='配布パッケージは準備中です。';list.append(li)}
}).catch(()=>{document.getElementById('packages').textContent='一覧を取得できませんでした。配布一覧URLから確認してください。'});
</script>
</html>
